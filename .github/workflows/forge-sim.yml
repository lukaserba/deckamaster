name: Forge headless match

# Step 1 spike: build the Forge rules engine and let two AI players
# play a Pauper match with no GUI. Proves the engine runs headless.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      games:
        description: Number of games
        default: "3"

env:
  # Pinned Forge commit, so builds are reproducible. Bump deliberately.
  FORGE_REF: b6f135e649de6ab8fd98df3cf8b32905b02340ba

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deckamaster
        uses: actions/checkout@v4

      - name: Checkout Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_REF }}
          path: forge

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Forge (desktop module, includes core/game/ai)
        working-directory: forge
        run: mvn -B -q -DskipTests -Dcheckstyle.skip -pl forge-gui-desktop -am install

      - name: Run AI vs AI Pauper match
        run: |
          JAR=$(ls forge/forge-gui-desktop/target/forge-gui-desktop-*-jar-with-dependencies.jar | head -1)
          echo "Using $JAR"
          mkdir -p run && cd run
          ln -s ../forge/forge-gui/res res
          java -Xmx3g -Djava.awt.headless=true -jar "../$JAR" sim \
            -d "$GITHUB_WORKSPACE/decks/pauper-mono-red.dck" "$GITHUB_WORKSPACE/decks/pauper-mono-blue.dck" \
            -n "${{ github.event.inputs.games || '3' }}" \
            -c 300 2>&1 | tee ../match.log
          grep -iE "won|winner|draw" ../match.log | tail -20 || true

      - name: Upload match log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-log
          path: match.log
